<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Worthington Insurance Agency</title>
    <script>
      // SPA redirect for GitHub Pages
      var base = "/worthington-agency";
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var redirect = base + "/?p=" + encodeURIComponent(path.slice(base.length) + search) + hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
